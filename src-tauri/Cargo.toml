[package]
name = "customsuno"
version = "0.2.0"
description = "CustomSuno desktop workspace"
authors = ["BoocordStudios"]
license = "MIT"
repository = "https://github.com/BoocordStudios/CustomSuno"
edition = "2021"
rust-version = "1.80"

[lib]
name = "customsuno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
percent-encoding = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
